<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사 | WHO AM I?</title><link rel="stylesheet" href="style.css"><header><a href="index.html">WHO AM I? / HOST</a><span id="time">대기</span></header><main><p id="notice" class="notice" role="status"></p><section id="setup" class="panel"><h2>새 사건 설정</h2><div id="types"></div><label>난이도<select id="level"><option value="0">전체 혼합</option><option value="1">LEVEL 1 · Rookie</option><option value="2">LEVEL 2 · Detective</option><option value="3">LEVEL 3 · Master</option></select></label><label>게임 시간<select id="duration"><option value="180">3분</option><option value="300" selected>5분</option><option value="420">7분</option></select></label><label><input type="checkbox" id="bonus" checked> 미스터리 상자</label><label><input type="checkbox" id="streak" checked> 연속 정답 보너스</label><label><input type="checkbox" id="auto" checked> 마지막 30초 순위 숨기기</label><button id="create" class="accent">게임 방 만들기</button></section><section id="lobby" class="panel" hidden><div class="grid"><div><div class="tag">ROOM CODE</div><h1 id="code"></h1><p id="joinlink" style="overflow-wrap:anywhere"></p><button id="copy">링크 복사</button></div><div id="qr"></div></div><h2 id="count"></h2><div id="members"></div><button id="start" class="accent">게임 시작</button></section><section id="live" class="panel" hidden><div class="row"><h2>LIVE MISSION</h2><span id="metrics"></span></div><div id="ranking"></div><div class="row"><button id="gold" class="accent">⚡ 골든 타임</button><button id="blind" class="secondary">순위 숨기기/해제</button><button id="end" class="danger">게임 종료</button></div></section><section id="results" class="panel" hidden><h2>MISSION COMPLETE</h2><div id="podium" class="podium"></div><h3>학생별 학습 결과</h3><div class="scroll"><table><thead><tr><th>순위</th><th>별명</th><th>점수</th><th>정답/풀이</th><th>정답률</th></tr></thead><tbody id="rows"></tbody></table></div><h3>유형별 정답률</h3><div id="stats"></div><button id="csv">CSV 다운로드</button></section><button id="delete" class="danger" hidden>방 삭제 및 새 게임</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script><script src="config.js"></script><script src="common.js"></script><script>
let host=load(localStorage,'wai-host'),state=null,report=null;for(const [k,v] of Object.entries(types)){let l=el('label'),i=el('input');i.type='checkbox';i.value=k;i.checked=true;l.append(i,' '+v);$('types').append(l)}const auth=()=>({p_room:host.room_id,p_secret:host.host_secret});function link(){return new URL('student.html?code='+host.code,location.href).href}function lobby(){ $('code').textContent=host.code;$('joinlink').textContent=link();$('qr').replaceChildren();try{let q=qrcode(0,'M');q.addData(link());q.make();$('qr').innerHTML=q.createImgTag(5,8)}catch{} }async function refresh(){if(!host)return;let t=Date.now();let s=await rpc('get_room_state',auth());sync(s,t);state=s;let r=s.room;show('setup',false);show('delete');show('lobby',r.status==='waiting');show('live',r.status==='playing');show('results',r.status==='ended');$('time').textContent=r.status==='playing'?clock(r):r.status==='ended'?'종료':'대기';if(r.status==='waiting'){ $('count').textContent=`참여 학생 ${s.count}/30명`;$('members').replaceChildren();for(const p of s.players){let row=el('p',undefined,'row'),b=el('button','제외','secondary');action(b,async()=>{await rpc('remove_player',{...auth(),p_player:p.id});await refresh()});row.append(el('span',avatars[p.avatar]+' '+p.name),b);$('members').append(row)}$('start').disabled=!s.count}if(r.status==='playing'){ranks($('ranking'),s.players.slice(0,12));let a=s.players.reduce((n,p)=>n+p.answered,0),c=s.players.reduce((n,p)=>n+p.correct,0);$('metrics').textContent=`${s.count}명 · ${a}회 풀이 · 정답률 ${rate(c,a)}${Date.parse(r.golden_until)>Date.now()+offset?' · GOLDEN TIME':''}`;}if(r.status==='ended'&&!report){report=await rpc('get_results',auth());$('podium').replaceChildren();for(const p of report.players.slice(0,3))$('podium').append(el('div',`${p.rank}위 ${avatars[p.avatar]} ${p.name} · ${p.score}점`));$('rows').replaceChildren();for(const p of report.players){let tr=el('tr');for(const x of [p.rank,p.name,p.score,`${p.correct}/${p.answered}`,rate(p.correct,p.answered)])tr.append(el('td',x));$('rows').append(tr)}stats($('stats'),report.stats)}}
action($('create'),async()=>{let p_types=[...$('types').querySelectorAll('input:checked')].map(x=>x.value);if(!p_types.length)throw Error('문제 유형을 선택하세요.');host=await rpc('create_room',{p_types,p_level:+$('level').value,p_duration:+$('duration').value,p_bonus:$('bonus').checked,p_streak:$('streak').checked,p_auto_blind:$('auto').checked});save(localStorage,'wai-host',host);lobby();await refresh()});action($('copy'),()=>navigator.clipboard.writeText(link()));action($('start'),async()=>{await rpc('start_game',auth());await refresh()});action($('gold'),()=>rpc('set_golden',auth()));action($('blind'),()=>rpc('set_blind',{...auth(),p_on:!state.room.blind}));action($('end'),async()=>{if(confirm('게임을 종료할까요?')){await rpc('end_game',auth());await refresh()}});action($('delete'),async()=>{if(!confirm('방과 모든 답안 기록을 삭제할까요?'))return;await rpc('delete_room',auth());localStorage.removeItem('wai-host');location.reload()});action($('csv'),()=>{if(!report)return;let esc=v=>'"'+String(v).replace(/^[=+\-@\t\r]/,"'$&").replaceAll('"','""')+'"';let data=[['순위','별명','점수','정답','풀이'],...report.players.map(p=>[p.rank,p.name,p.score,p.correct,p.answered])].map(r=>r.map(esc).join(',')).join('\n');let u=URL.createObjectURL(new Blob(['\ufeff',data],{type:'text/csv;charset=utf-8'})),a=el('a');a.href=u;a.download='detective-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});if(host){lobby();show('setup',false);show('delete')}poll(refresh);setInterval(()=>{if(state?.room.status==='playing')$('time').textContent=clock(state.room)},250);
</script></html>
