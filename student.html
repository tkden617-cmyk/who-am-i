<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학생 | WHO AM I?</title><link rel="stylesheet" href="style.css"><header><a href="index.html">WHO AM I?</a><span id="time">DETECTIVE</span></header><main class="student"><p id="notice" class="notice" role="status"></p><section id="join" class="panel"><div class="tag">DETECTIVE ID</div><h2>영어 탐정단 입장</h2><label>방 번호<input id="code" inputmode="numeric" maxlength="6" placeholder="6자리 방 번호"></label><label>별명<input id="name" maxlength="12" placeholder="실명 대신 별명"></label><div id="avatars" class="row"></div><br><button id="enter" class="accent">입장하기</button></section><section id="waiting" class="panel" hidden><h2>사건 접수 대기 중</h2><p id="welcome"></p><p>선생님이 시작하면 자동으로 문제가 표시됩니다.</p></section><section id="game" hidden><div class="panel"><div class="row"><b id="identity"></b><span id="score" class="score"></span><span id="gold" class="tag"></span></div><div id="kind" class="tag"></div><div id="passage" class="clue"></div><div id="prompt" class="clue"></div><div id="picture" class="portrait" style="text-align:center"></div><button id="listen" class="accent" hidden>🔊 영어 단서 듣기</button><div id="options" class="grid" style="margin-top:14px"></div><p id="feedback" role="status"></p><button id="next" hidden>NEXT CASE →</button></div><section class="panel"><h3>탐정 순위</h3><div id="ranking"></div></section></section><section id="result" class="panel" hidden><div class="tag">MISSION COMPLETE</div><h2 id="grade"></h2><p id="summary" class="score"></p><p id="accuracy"></p><h3>유형별 학습 결과</h3><div id="stats"></div><button id="again">다른 게임 입장</button></section><button id="leave" class="secondary" hidden>접속 정보 지우기</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script src="character.js"></script><script>
let player=load(sessionStorage,'wai-player'),avatar='fox',state=null,q=null,loading=false,answered=false,submitting=false,finished=false;const auth=()=>({p_player:player.player_id,p_token:player.token});const roomAuth=()=>({p_room:player.room_id,...auth()});$('code').value=(new URLSearchParams(location.search).get('code')||'').slice(0,6);for(const [k,v] of Object.entries(avatars)){let b=el('button',v,'avatar'+(k===avatar?' active':''));b.setAttribute('aria-label',k);b.onclick=()=>{avatar=k;for(const x of $('avatars').children)x.classList.remove('active');b.classList.add('active')};$('avatars').append(b)}function reset(){if(window.speechSynthesis)speechSynthesis.cancel();sessionStorage.removeItem('wai-player');location.reload()}$('again').onclick=reset;$('leave').onclick=()=>{if(confirm('이 기기의 접속 정보를 지울까요? 기존 별명으로 다시 입장하지 못할 수 있습니다.'))reset()};action($('enter'),async()=>{let code=$('code').value.trim(),name=$('name').value.trim();if(!/^\d{6}$/.test(code)||!name)throw Error('6자리 방 번호와 별명을 입력하세요.');player=await rpc('join_room',{p_code:code,p_name:name,p_avatar:avatar});save(sessionStorage,'wai-player',player);await refresh()});async function next(){if(loading||submitting||finished)return;loading=true;try{let res=await rpc('next_question',auth());if(res.result!=='ok')return;q=res.question;answered=false;render()}finally{loading=false}}function render(){ $('kind').textContent=`${types[q.type]} · LEVEL ${q.level}`;$('prompt').textContent=q.text||'';$('passage').textContent=q.passage||'';$('picture').replaceChildren();if(q.character)$('picture').append(portrait(q.character));show('listen',!!q.audio);$('feedback').textContent='';show('next',false);$('options').replaceChildren();for(const o of q.options){let b=el('button',undefined,'option');b.dataset.value=o.value;b.append(el('b',o.value));if(o.character)b.append(portrait(o.character));if(o.text)b.append(el('span',o.text));b.onclick=()=>submit(o.value);$('options').append(b)}}async function submit(value){if(submitting||answered||finished||!q)return;submitting=true;for(const b of $('options').children)b.disabled=true;try{let r=await rpc('submit_answer',{...auth(),p_question:q.id,p_choice:value});if(r.result==='closed'||r.result==='stale'){q=null;await refresh();return}answered=true;for(const b of $('options').children){if(b.dataset.value===r.answer)b.classList.add('correct');else if(b.dataset.value===value)b.classList.add('wrong')}$('score').textContent=r.score+' P';$('feedback').textContent=(r.result==='correct'?`정답! +${r.gain}점${r.bonus?' (보너스 '+r.bonus+'점)':''}`:'오답 · 정답 '+r.answer)+' / '+r.explanation;show('next')}catch(e){notice(e);for(const b of $('options').children)b.disabled=false}finally{submitting=false}}action($('next'),async()=>{await next()});$('listen').onclick=()=>{if(!window.speechSynthesis){notice('이 기기는 음성을 지원하지 않습니다. 선생님께 알려주세요.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(q.audio);u.lang='en-US';u.rate=.85;u.onerror=()=>notice('음성 재생에 실패했습니다.');speechSynthesis.speak(u)};async function refresh(){if(!player)return;let t=Date.now(),s=await rpc('get_room_state',roomAuth());sync(s,t);state=s;let r=s.room,m=s.me;show('join',false);show('leave');show('waiting',r.status==='waiting');show('game',r.status==='playing');show('result',r.status==='ended');$('time').textContent=r.status==='playing'?clock(r):r.status==='ended'?'종료':'대기';if(r.status==='waiting')$('welcome').textContent=`${avatars[m.avatar]} ${m.name} · ${s.count}명 입장`;if(r.status==='playing'){ $('identity').textContent=avatars[m.avatar]+' '+m.name;$('score').textContent=m.score+' P';$('gold').textContent=Date.parse(r.golden_until)>Date.now()+offset?'⚡ GOLDEN TIME':'';if(s.blind)$('ranking').textContent='순위 비공개 · 마지막까지 집중하세요!';else ranks($('ranking'),s.players.slice(0,5));if(!q&&!submitting)await next()}if(r.status==='ended'&&!finished){let report=await rpc('get_results',roomAuth());finished=true;if(window.speechSynthesis)speechSynthesis.cancel();let p=report.me,rank=report.players.find(x=>x.id===p.id)?.rank,acc=p.answered?p.correct/p.answered:0;$('grade').textContent=p.answered>=10&&acc>=.9?'Master Detective':p.answered>=8&&acc>=.8?'Senior Detective':p.answered>=5&&acc>=.7?'Junior Detective':'Rookie Detective';$('summary').textContent=`${p.score}점 · ${rank??'—'}위`;$('accuracy').textContent=`정답 ${p.correct} / ${p.answered} · 정답률 ${rate(p.correct,p.answered)}`;stats($('stats'),report.stats)}}if(player){show('join',false);show('leave')}poll(refresh);setInterval(()=>{if(state?.room.status==='playing')$('time').textContent=clock(state.room)},250);
</script></html>
